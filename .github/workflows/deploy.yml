# Manual deploy to GitHub Pages. Runs only when started from the Actions tab,
# so nothing goes live until the owner chooses to publish.
name: Deploy site (manual)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public URL of the site (for canonical links and sitemap)"
        required: true
        default: "https://piercecountycleaning.com"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
        env:
          SITE_URL: ${{ inputs.site_url }}
      - run: node tests/run.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
