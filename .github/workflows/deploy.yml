# Manual publish to GitHub Pages. Runs only when started from the Actions tab
# (Actions > Deploy site (manual) > Run workflow), so nothing goes live until
# the owner chooses to publish.
#
# It builds the site, runs the checks, and copies site/ to the gh-pages branch.
# GitHub Pages serves that branch at https://amarisct.github.io/pierce-county-cleaning-website/
# (Settings > Pages > Source: Deploy from a branch > gh-pages / root).
name: Deploy site (manual)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public URL of the site (for canonical links and sitemap)"
        required: true
        default: "https://amarisct.github.io/pierce-county-cleaning-website"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
        env:
          SITE_URL: ${{ inputs.site_url }}
      - run: node tests/run.js
      - name: Publish site/ to the gh-pages branch
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from main@${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
